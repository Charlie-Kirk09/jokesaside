version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: uniinfo-app:latest
    container_name: uniinfo_backend_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    volumes:
      - ./backups:/app/backups
    networks:
      - production_network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  web:
    image: nginx:alpine
    container_name: uniinfo_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      app:
        condition: service_healthy
    networks:
      - production_network
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget --spider -q http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  certbot_certs:
    driver: local
  certbot_www:
    driver: local

networks:
  production_network:
    driver: bridge
